[project]
name = "multibus-headway-forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.1.2",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "numpy>=2.4.4",
    "pandas>=2.2.0",
    "polars>=1.40.1",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "torch>=2.0.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
